
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <!-- Font Awesome -->
    

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .register-container {
            width: 900px;
            min-height: 580px;

            display: flex;

            background: white;

            border-radius: 25px;

            overflow: hidden;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        /* Left Side */

        .welcome-section {
            width: 45%;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 40px;

            color: white;
            text-align: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .welcome-section i {
            font-size: 75px;
            margin-bottom: 25px;
        }

        .welcome-section h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .welcome-section p {
            line-height: 1.6;
            opacity: 0.9;
        }

        /* Right Side */

        .register-section {
            width: 55%;

            padding: 40px 50px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .register-section h2 {
            font-size: 30px;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        /* Input */

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;

            margin-bottom: 7px;

            color: #444;

            font-weight: bold;
        }

        .input-field {
            position: relative;
        }

        .input-field i {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #888;
        }

        .input-field input {
            width: 100%;

            padding: 13px 45px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            transition: 0.3s;
        }

        .input-field select{

            width: 100%;
            padding: 13px 45px;
        }

        .input-field input:focus {
            border-color: #667eea;

            box-shadow:
                0 0 8px
                rgba(102, 126, 234, 0.2);
        }

        /* Register Button */

        .register-btn {
            width: 100%;

            padding: 14px;

            margin-top: 10px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .register-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(102, 126, 234, 0.4);
        }

        /* Login Link */

        .login-link {
            text-align: center;

            margin-top: 20px;

            color: #777;

            font-size: 14px;
        }

        .login-link a {
            color: #667eea;

            font-weight: bold;

            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 750px) {

            .register-container {
                width: 90%;
            }

            .welcome-section {
                display: none;
            }

            .register-section {
                width: 100%;

                padding: 40px 30px;
            }
        }

    </style>
<link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="register-container">

        <!-- Welcome -->

        <div class="welcome-section">

             <img src="img/logo.png" alt="" srcset="">

            <h1>Join Us!</h1>

            <p>
                Create your account and start
                exploring amazing destinations,
                hotels and travel experiences.
            </p>

        </div>


        <!-- Register Form -->

        <div class="register-section">

            <h2>Create Account</h2>

            <p class="subtitle">
                Register to start your journey
            </p>


            <form id="auth-form">
                <div class="input-group">

                    <label>Role</label>

                    <div class="input-field">

                        <i class="fa-solid fa-circle-user"></i>
                        <select id="role" name="role" required>
                            <option value="" disabled selected>Select Your role</option> 
                            <option value="admin">Admin (demo)</option>
                            <option value="user">Student / User</option>
                            <option value="owner">Property Owner</option>
                        </select>
                        

                    </div>

                </div>


                <!-- Full Name -->

                <div class="input-group">

                    <label>Full Name</label>

                    <div class="input-field">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>

                </div>


                <!-- Email -->

                <div class="input-group">

                    <label>Email Address</label>

                    <div class="input-field">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <!-- Phone -->

                <div class="input-group">

                    <label>Phone Number</label>

                    <div class="input-field">

                        <i class="fa-solid fa-phone"></i>

                        <input
                            type="tel"
                            name="phonenum"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>

                </div>

                <!-- Role -->

                

                <!-- Password -->

                <div class="input-group">

                    <label>Password</label>

                    <div class="input-field">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            name="password" minlength="8"
                            placeholder="Create a password"
                            required
                        >

                    </div>

                </div>


                <!-- Confirm Password -->

                <div class="input-group">

                    <label>Confirm Password</label>

                    <div class="input-field">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            name="confirm"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>

                </div>


                <!-- Button -->

                <button
                    type="submit"
                    class="register-btn">

                    Create Account

                </button>


                <!-- Login -->

                <div class="login-link">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </div>

            <p id="auth-message" role="status"></p><p class="demo-note">Local demo · Use a sample password, not a real one.</p><p class="login-link"><a href="index.html">Browse properties as a guest →</a></p></form>

        </div>

    </div>

<script src="data.js"></script><script src="auth.js"></script></body>
</html>
